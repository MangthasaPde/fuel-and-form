name = "fuel-and-form-push"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Runs every hour; the Worker sends a notification to anyone whose local time is Saturday noon.
[triggers]
crons = ["0 * * * *"]

# Created with: npx wrangler kv namespace create SUBS   (paste the id it prints here)
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

[vars]
# Your published app's address, e.g. https://yourname.github.io  (no path, no trailing slash)
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-USERNAME.github.io"
VAPID_SUBJECT = "https://REPLACE-WITH-YOUR-USERNAME.github.io"
VAPID_PUBLIC = "BBIh0yLxe_wBPYB9AOstodsIbpx9CokdlAxgzoVOBzX8FPzH-dU1SdMBKcQFv7liBZnQ375CfuelfMRB2zcMuYo"
